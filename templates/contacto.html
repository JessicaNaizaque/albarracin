<section id="contacto" class="py-5">

    <div class="container ">

        <div class="row align-items-center g-5 ">

            <!-- Imagen -->

            <div class="col-lg-6">

                <img
                    src="assets/img/foto-contactp.jpg"
                    class="img-fluid w-100 contacto-img"
                    alt="Christian Albarracín">

            </div>

            <!-- Formulario -->

            <div class="col-lg-6 mt-6">

                <h1 class="contact-title">
                    <span class="script">H</span>
                    ABLEMOS
                    <br>
                    DE ARTE
                </h1>

                <p class="contact-copy">

                    Si deseas adquirir una obra, realizar una consulta o conocer
                    más sobre el trabajo del artista, completa el siguiente
                    formulario.

                </p>

                <form
                    id="contactForm"
                    class="needs-validation"
                    novalidate>

                    <div class="mb-4">

                        <label class="form-label">
                            Tu nombre
                        </label>

                        <input
                            type="text"
                            class="form-control form-line"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            class="form-control form-line"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Asunto
                        </label>

                        <input
                            type="text"
                            class="form-control form-line"
                            required>

                    </div>

                    <div class="mb-5">

                        <label class="form-label">
                            Mensaje
                        </label>

                        <textarea
                            rows="8"
                            class="form-control form-area"
                            required></textarea>

                    </div>

                    <div class="text-end">

                        <button
                            class="btn btn-dark px-5 py-3"
                            type="submit">

                            ENVIAR MENSAJE

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</section>
